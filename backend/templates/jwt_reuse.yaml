name: jwt-reuse-exfil
description: Login as userA and try to access userB profile
steps:
  - id: login_userA
    method: POST
    path: /login
    body:
      username: "userA"
      password: "Password123"
    capture:
      token: "$.token"

  - id: get_userB_profile
    method: GET
    path: /users/2/profile
    headers:
      Authorization: "Bearer {{ token }}"
    expect_status: 200
